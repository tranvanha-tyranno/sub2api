name: Build Docker Web

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docs/legal/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/docker-entrypoint.sh'
      - '.github/workflows/docker-web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docs/legal/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/docker-entrypoint.sh'
      - '.github/workflows/docker-web.yml'
  workflow_dispatch:

concurrency:
  group: docker-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Resolve image name and build metadata
        id: image
        shell: bash
        run: |
          {
            echo "name=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "version=$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=long
      - name: Build frontend and backend into Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.image.outputs.date }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          cache-from: type=gha,scope=docker-web
          cache-to: type=gha,mode=max,scope=docker-web
      - name: Deployment instructions
        if: github.event_name != 'pull_request'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          {
            echo "### Docker image published (web + API)"
            echo "Image: \`$IMAGE_NAME:sha-$GITHUB_SHA\`"
            echo 'Platforms: linux/amd64, linux/arm64'
            echo 'Server: set SUB2API_IMAGE in deploy/.env, then run:'
            echo '```sh'
            echo 'docker compose -f docker-compose.local.yml pull sub2api'
            echo 'docker compose -f docker-compose.local.yml up -d --no-build sub2api'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
